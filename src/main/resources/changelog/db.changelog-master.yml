# Definimos o changelog mestre do Liquibase que referencia arquivos SQL
# externos para inicializar o banco de dados.

databaseChangeLog:
  - changeSet:
      id: 001
      author: gabriel
      changes:
        - sqlFile:
            path: sql/001-init-values.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 002
      author: gabriel
      changes:
        - sqlFile:
            path: sql/002-insert-data-to-tables.sql
            relativeToChangelogFile: true